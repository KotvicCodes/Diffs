<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare two text files, privately. A simple file diff tool that works entirely in your browser." />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg?inline" />
    <title>Diffs</title>
  </head>
  <body>
    <div class="app">
      <header class="site-header" id="top">
        <a class="brand" href="#top" aria-label="Diffs home"><span class="brand-icon" aria-hidden="true">−<br />+</span>Diffs<span class="brand-dot">.</span></a>
        <button id="sample" class="text-button">Example <svg class="icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 12 12 4M4 4h8v8" /></svg></button>
      </header>

      <main>
        <h1 class="sr-only">Compare files</h1>

        <div class="workspace">
          <div class="toolbar">
            <div class="view-label">Files</div>
            <div class="toolbar-actions"><button id="swap" title="Swap original and changed text"><svg class="icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M2 5h12l-3-3M14 11H2l3 3" /></svg> Swap</button><button id="clear" class="muted-button">Clear</button></div>
          </div>

          <div class="editor-headers">
            <div class="panel-header" data-side="left"><div class="file-heading"><span class="file-dot original-dot"></span><span class="panel-label">Original</span><span id="left-name" class="file-name" title="Pasted text">Pasted text</span></div><div class="file-actions"><button class="copy-button" data-copy="left" aria-label="Copy original text">Copy</button><button class="file-button" data-open="left">Open file <span aria-hidden="true">↑</span></button></div><input type="file" id="left-file" hidden aria-label="Open original file" /></div>
            <div class="panel-header" data-side="right"><div class="file-heading"><span class="file-dot changed-dot"></span><span class="panel-label">Changed</span><span id="right-name" class="file-name" title="Pasted text">Pasted text</span></div><div class="file-actions"><button class="copy-button" data-copy="right" aria-label="Copy changed text">Copy</button><button class="file-button" data-open="right">Open file <span aria-hidden="true">↑</span></button></div><input type="file" id="right-file" hidden aria-label="Open changed file" /></div>
          </div>
          <div id="editors" aria-label="Editable file comparison"></div>
          <div class="editor-footers">
            <div class="panel-footer"><span id="left-meta">0 lines · 0 characters</span><span id="left-newline" hidden>No final newline</span></div>
            <div class="panel-footer"><span id="right-meta">0 lines · 0 characters</span><span id="right-newline" hidden>No final newline</span></div>
          </div>

          <div class="workspace-footer">
            <div class="options"><label><input type="checkbox" id="ignore-whitespace" />Ignore whitespace</label><label><input type="checkbox" id="wrap" checked />Wrap lines</label></div>
            <div class="legend"><span class="removed-legend">− Removed</span><span class="added-legend">+ Added</span></div>
          </div>
        </div>
        <div class="under-workspace"><p id="message" role="status" aria-live="polite"></p><span id="change-count" hidden></span></div>
      </main>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
